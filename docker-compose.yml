services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: discord_rpg
      POSTGRES_USER: discord_rpg
      POSTGRES_PASSWORD: "!ChangeMe!"
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    volumes:
      - ./backend:/var/www/app
    depends_on:
      - database
    environment:
      DATABASE_URL: "postgresql://discord_rpg:!ChangeMe!@database:5432/discord_rpg?serverVersion=16&charset=utf8"

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/app
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

volumes:
  db-data:
