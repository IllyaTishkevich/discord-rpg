services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: discord_rpg
      POSTGRES_USER: discord_rpg
      POSTGRES_PASSWORD: "!ChangeMe!"
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    volumes:
      - ./backend:/var/www/app
    depends_on:
      - database
    # bot/ isn't containerized (it runs directly on the host, `npm run dev`
    # in bot/), so reaching its realtime relay (bot/src/realtime/server.js)
    # from inside this container needs the host's own gateway address.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: "postgresql://discord_rpg:!ChangeMe!@database:5432/discord_rpg?serverVersion=16&charset=utf8"
      BOT_INTERNAL_URL: "http://host.docker.internal:3002"

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/app
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    # Proxies /ws to the host-based bot process's realtime relay — see the
    # backend service's own comment above.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  db-data:
