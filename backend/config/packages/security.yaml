security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: discordId
        admin_provider:
            entity:
                class: App\Entity\Admin
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        admin:
            pattern: ^/admin
            lazy: true
            provider: admin_provider
            custom_authenticators:
                - App\Security\GoogleAuthenticator
            entry_point: App\Security\GoogleAuthenticator
            logout:
                path: admin_logout
                target: admin_login
        api_auth:
            pattern: ^/api/auth
            stateless: true
            security: false
        api_bot:
            pattern: ^/api/bot
            stateless: true
            security: false
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

    access_control:
        - { path: ^/admin/(login|oauth), roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/api/auth, roles: PUBLIC_ACCESS }
        - { path: ^/api/bot, roles: PUBLIC_ACCESS }
        - { path: ^/api/equipment$, methods: [GET], roles: PUBLIC_ACCESS }
        # Catalog icons (UploadsController) — an <img src> can't carry a
        # Bearer token, and these are just public catalog artwork anyway.
        - { path: ^/api/uploads/, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/characters/leaderboard$, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/tournaments/(open|latest)$, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/tournaments/\d+$, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
