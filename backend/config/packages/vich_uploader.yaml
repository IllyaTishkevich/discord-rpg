vich_uploader:
    db_driver: orm
    mappings:
        monster_icon:
            uri_prefix: /uploads/monsters
            upload_destination: '%kernel.project_dir%/public/uploads/monsters'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
        bit_icon:
            uri_prefix: /uploads/bits
            upload_destination: '%kernel.project_dir%/public/uploads/bits'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
        character_class_icon:
            uri_prefix: /uploads/classes
            upload_destination: '%kernel.project_dir%/public/uploads/classes'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
        ability_icon:
            uri_prefix: /uploads/abilities
            upload_destination: '%kernel.project_dir%/public/uploads/abilities'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
        equipment_icon:
            uri_prefix: /uploads/equipment
            upload_destination: '%kernel.project_dir%/public/uploads/equipment'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
        item_icon:
            uri_prefix: /uploads/items
            upload_destination: '%kernel.project_dir%/public/uploads/items'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
