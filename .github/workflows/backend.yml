name: backend

on:
  push:
    paths:
      - "backend/**"
  pull_request:
    paths:
      - "backend/**"

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      database:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: discord_rpg_test
          POSTGRES_USER: discord_rpg
          POSTGRES_PASSWORD: "!ChangeMe!"
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://discord_rpg:!ChangeMe!@localhost:5432/discord_rpg_test?serverVersion=16&charset=utf8"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer dump-autoload --optimize
      - run: php bin/console lint:yaml config --parse-tags
      - run: php bin/phpunit
