name: activity

on:
  push:
    paths:
      - "activity/**"
  pull_request:
    paths:
      - "activity/**"

defaults:
  run:
    working-directory: activity

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: activity/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
